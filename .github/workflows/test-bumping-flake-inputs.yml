name: Test nixpkgs-pointer update

on:
  workflow_dispatch:
  schedule:
    # Every Saturday at 21:00 UTC.
    - cron: 0 21 * * 6

permissions:
  contents: read

concurrency:
  group: test-nixpkgs-pointer-update
  cancel-in-progress: true

jobs:
  bump-inputs-then-rebuild-hosts:
    name: Pointer update (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: ./tools/test-bumping-flake-inputs.sh
